name: Generate Professional Profile Banner

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/profile-banner.yml'
      - 'README.md'
  schedule:
    - cron: '17 0 * * 0'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install Pillow
        run: python -m pip install --disable-pip-version-check pillow

      - name: Build animated hero banner
        env:
          AVATAR_URL: https://github.com/KrishnaNaik6.png?size=512
        run: |
          python - <<'PY'
          import io, math, os, urllib.request
          from PIL import Image, ImageDraw, ImageFilter, ImageFont

          W, H = 1200, 420
          FRAMES = 36
          avatar_url = os.environ['AVATAR_URL']

          avatar = Image.open(io.BytesIO(urllib.request.urlopen(avatar_url).read())).convert('RGBA')
          avatar = avatar.resize((230, 230), Image.Resampling.LANCZOS)
          mask = Image.new('L', avatar.size, 0)
          ImageDraw.Draw(mask).ellipse((0, 0, 229, 229), fill=255)
          avatar.putalpha(mask)

          font_big = ImageFont.truetype('/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf', 42)
          font_mid = ImageFont.truetype('/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf', 22)
          font_small = ImageFont.truetype('/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf', 16)

          frames = []
          for f in range(FRAMES):
              t = f / FRAMES
              img = Image.new('RGBA', (W, H), (5, 9, 20, 255))
              d = ImageDraw.Draw(img)

              for y in range(H):
                  p = y / H
                  d.line((0, y, W, y), fill=(5 + int(8*p), 10 + int(12*p), 25 + int(25*p), 255))

              horizon = 280
              for x in range(-600, W + 700, 60):
                  d.line((W//2 + (x-W//2)*0.08, horizon, x, H), fill=(35, 85, 130, 45), width=1)
              for yy in [295, 315, 338, 365, 397]:
                  d.line((0, yy, W, yy), fill=(35, 85, 130, 35), width=1)

              glow = Image.new('RGBA', (W, H), (0, 0, 0, 0))
              gd = ImageDraw.Draw(glow)

              for radius, phase, alpha in [(210, 0.0, 120), (270, 0.32, 85), (340, 0.62, 55)]:
                  box = (W//2-radius, 175-radius, W//2+radius, 175+radius)
                  a = (t + phase) * 360
                  gd.arc(box, a, a+90, fill=(40, 205, 255, alpha), width=5)
                  gd.arc(box, a+180, a+265, fill=(160, 80, 255, alpha), width=4)

              for i in range(70):
                  seed = i * 17.31
                  x0 = (seed * 73) % W
                  y0 = 35 + ((seed * 41) % 250)
                  drift = math.sin(t*2*math.pi + i) * (3 + i % 6)
                  r = 1 + (i % 3)
                  alpha = 45 + (i % 5) * 18
                  gd.ellipse((x0+drift-r, y0-r, x0+drift+r, y0+r), fill=(100, 215, 255, alpha))

              for i, (cx, cy, s) in enumerate([(90,95,24),(1060,90,28),(1010,235,18),(180,260,16)]):
                  bob = math.sin(t*2*math.pi + i) * 7
                  x, y = cx, cy + bob
                  pts = [(x,y-s),(x+s,y-s//2),(x+s,y+s//2),(x,y+s),(x-s,y+s//2),(x-s,y-s//2)]
                  gd.line(pts+[pts[0]], fill=(80, 220, 255, 120), width=2)
                  gd.line((x-s,y-s//2,x,y), fill=(160,95,255,120), width=2)
                  gd.line((x,y,x+s,y-s//2), fill=(80,220,255,100), width=2)

              img.alpha_composite(glow.filter(ImageFilter.GaussianBlur(8)))
              d = ImageDraw.Draw(img)

              for i, (cx, cy) in enumerate([(90,95),(1060,90),(1010,235),(180,260)]):
                  bob = math.sin(t*2*math.pi + i) * 7
                  x, y = cx, cy + bob
                  s = [24,28,18,16][i]
                  pts = [(x,y-s),(x+s,y-s//2),(x+s,y+s//2),(x,y+s),(x-s,y+s//2),(x-s,y-s//2)]
                  d.line(pts+[pts[0]], fill=(95,225,255,190), width=2)
                  d.line((x-s,y-s//2,x,y), fill=(175,105,255,180), width=2)

              pulse = 1 + 0.035 * math.sin(t*2*math.pi)
              r = int(130*pulse)
              d.ellipse((145-r, 175-r, 145+r, 175+r), outline=(70,215,255,180), width=3)
              d.ellipse((145-r+8, 175-r+8, 145+r-8, 175+r-8), outline=(170,90,255,150), width=2)
              img.alpha_composite(avatar, (30, 60))
              d = ImageDraw.Draw(img)
              d.ellipse((27,57,263,293), outline=(230,250,255,235), width=4)

              d.text((310, 88), 'KRISHNA UMESH NAIK', font=font_big, fill=(235, 244, 255, 255))
              d.text((313, 145), 'AI & ML  •  FULL-STACK  •  INTELLIGENT SYSTEMS', font=font_mid, fill=(110, 220, 255, 245))
              d.text((313, 188), 'Building practical AI systems, scalable software', font=font_mid, fill=(190, 205, 225, 225))
              d.text((313, 218), 'and production-ready digital experiences.', font=font_mid, fill=(190, 205, 225, 225))

              scan_x = 310 + int((W-350) * ((t*1.4) % 1))
              d.line((313, 260, 1070, 260), fill=(60, 110, 160, 80), width=1)
              d.ellipse((scan_x-4, 256, scan_x+4, 264), fill=(80, 230, 255, 230))

              labels = [('AI/ML',313),('AGENTS',425),('RAG',548),('VISION',640),('SYSTEMS',760)]
              for label, x in labels:
                  d.rounded_rectangle((x,285,x+92,320), radius=10, outline=(65,150,210,120), width=1, fill=(12,24,45,180))
                  d.text((x+13,294), label, font=font_small, fill=(175,225,255,230))

              d.text((313, 355), '●  OPEN TO BUILDING • LEARNING • SHIPPING', font=font_small, fill=(120,190,220,190))
              frames.append(img.convert('P', palette=Image.Palette.ADAPTIVE, colors=128))

          os.makedirs('assets', exist_ok=True)
          frames[0].save('assets/profile-banner.gif', save_all=True, append_images=frames[1:], duration=90, loop=0, optimize=False, disposal=2)
          PY

      - name: Verify banner
        run: |
          python - <<'PY'
          from PIL import Image
          im = Image.open('assets/profile-banner.gif')
          print(f'Banner: {im.size[0]}x{im.size[1]}, frames={getattr(im, "n_frames", 1)}')
          assert im.size == (1200, 420)
          assert getattr(im, 'n_frames', 1) > 1
          PY

      - name: Commit generated banner
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/profile-banner.gif
          git diff --cached --quiet || git commit -m 'chore: update professional animated profile banner'
          git push
