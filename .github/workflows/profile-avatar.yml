name: Generate Animated Profile Avatar Asset

on:
  schedule:
    - cron: '23 0 * * 0'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install Pillow
        run: python -m pip install --disable-pip-version-check pillow

      - name: Generate animated avatar
        run: |
          python - <<'PY'
          import io, math, urllib.request
          from PIL import Image, ImageDraw, ImageFilter

          S = 520
          avatar = Image.open(io.BytesIO(urllib.request.urlopen('https://github.com/KrishnaNaik6.png?size=512').read())).convert('RGBA')
          avatar = avatar.resize((250, 250), Image.Resampling.LANCZOS)
          mask = Image.new('L', (250, 250), 0)
          ImageDraw.Draw(mask).ellipse((0, 0, 249, 249), fill=255)
          avatar.putalpha(mask)

          frames = []
          for n in range(36):
              t = n / 36
              frame = Image.new('RGBA', (S, S), (8, 12, 24, 255))
              glow = Image.new('RGBA', (S, S), (0, 0, 0, 0))
              g = ImageDraw.Draw(glow)

              for radius, phase, width, alpha in [(150, 0.0, 7, 200), (174, 0.25, 5, 140), (198, 0.5, 4, 95)]:
                  a = (t + phase) * 360
                  box = (S//2-radius, S//2-radius, S//2+radius, S//2+radius)
                  g.arc(box, a, a+110, fill=(65, 220, 255, alpha), width=width)
                  g.arc(box, a+180, a+290, fill=(155, 90, 255, alpha), width=width)

              for i in range(20):
                  a = 2*math.pi*(i/20 + t*(0.35 if i % 2 else -0.22))
                  r = 165 + 20*math.sin(i*1.9)
                  x, y = S/2+r*math.cos(a), S/2+r*math.sin(a)
                  g.ellipse((x-3, y-3, x+3, y+3), fill=(120, 225, 255, 160))

              frame.alpha_composite(glow.filter(ImageFilter.GaussianBlur(9)))
              d = ImageDraw.Draw(frame)
              pulse = 1 + 0.025*math.sin(2*math.pi*t)
              r = int(138*pulse)
              d.ellipse((S//2-r, S//2-r, S//2+r, S//2+r), outline=(100, 230, 255, 220), width=3)
              d.ellipse((S//2-r+7, S//2-r+7, S//2+r-7, S//2+r-7), outline=(165, 100, 255, 170), width=2)
              frame.alpha_composite(avatar, (135, 135))
              d = ImageDraw.Draw(frame)
              d.ellipse((134, 134, 386, 386), outline=(225, 245, 255, 235), width=4)
              frames.append(frame.convert('P', palette=Image.Palette.ADAPTIVE, colors=128))

          frames[0].save('assets/profile-avatar.gif', save_all=True, append_images=frames[1:], duration=75, loop=0, optimize=True, disposal=2)
          PY

      - name: Commit animation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/profile-avatar.gif
          git diff --cached --quiet || git commit -m 'chore: update animated profile avatar'
          git push
